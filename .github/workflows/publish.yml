name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TEMP: ${{ github.workspace }}/Temp/release
      TMP: ${{ github.workspace }}/Temp/release
      TMPDIR: ${{ github.workspace }}/Temp/release
      PIP_CACHE_DIR: ${{ github.workspace }}/Temp/release/pip-cache
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Prepare temporary build directory
        run: mkdir -p Temp/release/source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m venv Temp/release/build-env
          Temp/release/build-env/bin/python -m pip install build
          git archive HEAD | tar -x -C Temp/release/source
          Temp/release/build-env/bin/python -m build Temp/release/source --outdir Temp/release/dist

      - name: Publish to PyPI (Trusted Publishing)
        # Use the official image directly to keep generated action files out of .github/.tmp.
        uses: docker://ghcr.io/pypa/gh-action-pypi-publish:release-v1
        env:
          TEMP: /github/workspace/Temp/release
          TMP: /github/workspace/Temp/release
          TMPDIR: /github/workspace/Temp/release
          PIP_CACHE_DIR: /github/workspace/Temp/release/pip-cache
        with:
          user: __token__
          password: ""
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: Temp/release/dist
          verify-metadata: "true"
          skip-existing: "false"
          verbose: "false"
          print-hash: "true"
          attestations: "true"
