name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: Temp/tests/venv/Scripts/python.exe
          - os: macos-latest
            python: Temp/tests/venv/bin/python
    runs-on: ${{ matrix.os }}
    env:
      TEMP: ${{ github.workspace }}/Temp/tests
      TMP: ${{ github.workspace }}/Temp/tests
      TMPDIR: ${{ github.workspace }}/Temp/tests
      PIP_CACHE_DIR: ${{ github.workspace }}/Temp/tests/pip-cache
      DUSHAN_QUOTA_HOME: ${{ github.workspace }}/Temp/tests/state
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare test directory
        run: python -c "import os; from pathlib import Path; Path(os.environ['TEMP']).mkdir(parents=True, exist_ok=True)"
      - name: Create test environment
        run: python -m venv Temp/tests/venv
      - name: Install dependencies
        run: ${{ matrix.python }} -m pip install -r requirements.txt
      - name: Python tests
        run: ${{ matrix.python }} -m unittest discover -s tests -q
      - name: UI state tests
        run: node tests/test_ui_state.cjs
