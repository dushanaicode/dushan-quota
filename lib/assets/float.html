<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",system-ui,sans-serif; }
  :root, body[data-theme="dark"] {
    color-scheme:dark;
    --ease:cubic-bezier(.2,.7,.2,1); --option-bg:#10131a;
    --panel:#10131a; --text:#e9eef7; --muted:#a4b0c4; --faint:#8794ab; --dim:#6b7690;
    --line:rgba(255,255,255,.07); --track:rgba(255,255,255,.10);
    --accent:#6ea8fe; --accent-soft:rgba(110,168,254,.18);
    --ok:#4ade88; --warn:#f5c664; --bad:#f87171;
    --card:rgba(255,255,255,.03);
  }
  body[data-theme="ocean"] {
    --panel:#0b1520; --text:#e8f1fb; --muted:#9fb6cf; --faint:#7e96b2; --dim:#68809c;
    --line:rgba(150,200,255,.10); --track:rgba(150,200,255,.14);
    --accent:#54b9ff; --accent-soft:rgba(84,185,255,.20);
    --ok:#3fd9a4; --warn:#ffd166; --bad:#ff7a85;
    --card:rgba(84,185,255,.05);
  }
  body[data-theme="forest"] {
    --panel:#0c1a12; --text:#e9f7ee; --muted:#a4c6b2; --faint:#84a793; --dim:#6a8a78;
    --line:rgba(160,255,200,.09); --track:rgba(160,255,200,.13);
    --accent:#52d689; --accent-soft:rgba(82,214,137,.20);
    --ok:#4ade88; --warn:#ffd166; --bad:#ff8a80;
    --card:rgba(82,214,137,.05);
  }
  body[data-theme="violet"] {
    --panel:#171225; --text:#f1ecfb; --muted:#bcafda; --faint:#9a8cba; --dim:#7e7099;
    --line:rgba(200,170,255,.10); --track:rgba(200,170,255,.14);
    --accent:#b18cff; --accent-soft:rgba(177,140,255,.20);
    --ok:#5ce0a0; --warn:#ffd166; --bad:#ff8a9e;
    --card:rgba(177,140,255,.06);
  }
  body[data-theme="paper"] {
    color-scheme:light; --option-bg:#f5f6f8;
    --panel:#f5f6f8; --text:#232a35; --muted:#4c586a; --faint:#6c7889; --dim:#8792a1;
    --line:rgba(20,30,45,.10); --track:rgba(20,30,45,.12);
    --accent:#2563eb; --accent-soft:rgba(37,99,235,.14);
    --ok:#15803d; --warn:#b45309; --bad:#dc2626;
    --card:rgba(20,30,45,.04);
  }
  html,body { background:var(--panel); overflow:hidden; height:100%; }
  html.mac, html.mac body { background:transparent; }
  body { color:var(--text); font-size:13px; user-select:none; -webkit-user-select:none; }
  #panel {
    background:var(--panel);
    height:100vh;
    display:flex; flex-direction:column;
    overflow:hidden;
    position:relative; z-index:1;
  }
  #bg, #scrim { position:fixed; inset:0; z-index:0; pointer-events:none; display:none; }
  #bg { background-size:cover; background-position:center; }
  body.bg #bg { display:block; }
  body.bg #scrim { display:block; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
  body.bg #panel { background:transparent; }
  body.bg {
    color-scheme:dark; --option-bg:#10131a;
    --text:#ffffff; --muted:#e6ebf4; --faint:#ccd5e3; --dim:#b6c0d0;
    --track:rgba(0,0,0,.40); --card:rgba(8,11,18,.42); --line:rgba(255,255,255,.12);
  }
  body.bg .hdr, body.bg #body, body.bg #cfg { text-shadow:0 1px 3px rgba(0,0,0,.6); }
  body.bg .card { background:var(--card); border:0; border-radius:10px; padding:8px 10px; margin:6px 0; }
  body.bg #cfg { background:rgba(10,13,20,.55); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
  .rs {
    position:absolute; right:0; bottom:0; width:18px; height:18px;
    cursor:nwse-resize; z-index:5;
    background:
      linear-gradient(135deg, transparent 0 46%, var(--faint) 46% 54%, transparent 54% 66%, var(--faint) 66% 74%, transparent 74% 86%, var(--faint) 86% 94%, transparent 94%);
    opacity:.7;
  }
  .rs:hover { opacity:1; }
  .hdr {
    display:flex; align-items:center; gap:7px;
    padding:10px 12px 9px;
    border-bottom:1px solid var(--line);
    cursor:move; flex:none;
  }
  .hdr .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; box-shadow:0 0 6px var(--ok); }
  .hdr .dot.loading { background:var(--warn); box-shadow:0 0 7px var(--warn); animation:pulse .8s ease-in-out infinite alternate; }
  .hdr .dot.error { background:var(--bad); box-shadow:0 0 7px var(--bad); }
  .hdr b { font-size:13px; font-weight:600; letter-spacing:.5px; }
  .status { min-width:0; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--faint); font-size:10px; }
  .hdr .sp { flex:1; }
  .ico { display:inline-flex; align-items:center; justify-content:center; cursor:pointer; opacity:.5; font-size:12px; line-height:1; padding:3px 4px; border-radius:5px; transition:opacity .15s, transform .1s; }
  .ico:active { transform:scale(.85); }
  .ico:hover { opacity:1; background:var(--track); }
  .ico.on { opacity:1; }
  .ico.pin i { display:inline-block; font-style:normal; transform:rotate(-45deg); filter:grayscale(1); transition:transform .2s ease, filter .2s ease; }
  .ico.pin.on { opacity:1; }
  .ico.pin.on i { transform:rotate(0deg); filter:none; }
  .ico.loading { opacity:1; pointer-events:none; animation:spin .7s linear infinite; }
  #panel.refreshed { animation:flash .55s ease-out; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse { to { opacity:.45; transform:scale(.82); } }
  @keyframes flash { 0% { box-shadow:inset 0 0 0 1px var(--ok); } 100% { box-shadow:inset 0 0 0 1px transparent; } }
  #body { overflow-y:auto; padding:4px 12px 8px; flex:1; min-height:0; }
  #body::-webkit-scrollbar, #cfg::-webkit-scrollbar { width:4px; }
  #body::-webkit-scrollbar-thumb, #cfg::-webkit-scrollbar-thumb { background:var(--track); border-radius:99px; }
  .card { padding:9px 0 8px; border-top:1px solid var(--line); }
  .card:first-child { border-top:0; }
  .name { display:flex; align-items:center; gap:7px; margin-bottom:5px; }
  .name b { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; }
  .pill { font-size:10px; padding:1px 7px; border-radius:99px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; flex:none; }
  .name span { font-size:11px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sub { color:var(--dim); font-size:10px; margin:-2px 0 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row { margin:6px 0 2px; }
  .row .top { display:flex; align-items:baseline; gap:7px; margin-bottom:4px; }
  .row .lbl { font-size:12px; color:var(--muted); white-space:nowrap; }
  .row .rst { flex:1; text-align:right; font-size:10.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .pct { font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .bar { height:6px; border-radius:99px; background:var(--track); overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:99px; }
  .txt { font-size:11px; color:var(--muted); }
  .usage { margin:8px 0 2px; padding:6px 8px; border-radius:8px; background:var(--card); border:1px solid var(--line); }
  .usage-title { font-size:10px; color:var(--dim); margin-bottom:4px; }
  .usage-filter { display:flex; align-items:center; gap:4px; margin:0 0 5px; overflow:hidden; }
  .usage-periods { display:flex; gap:2px; min-width:0; }
  .usage-periods button { border:0; border-radius:5px; padding:2px 5px; background:var(--track); color:var(--dim); font-size:8.5px; }
  .usage-periods button.on { background:var(--accent-soft); color:var(--accent); }
  .usage-filter select { min-width:0; flex:1; height:20px; border:1px solid var(--line); border-radius:5px;
    padding:0 3px; background:var(--track); color:var(--muted); font-size:8.5px; outline:none; }
  .usage-filter option { background:var(--option-bg); color:var(--text); }
  .usage-line, .usage-model-main { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:baseline; gap:7px; padding:2px 0; }
  .usage-line .src { font-size:10px; color:var(--accent); white-space:nowrap; }
  .usage-line .ulbl, .usage-model-main .ulbl { min-width:0; font-size:10.5px; color:var(--muted); white-space:normal; overflow-wrap:anywhere; }
  .usage-line .uval, .usage-model-main .uval { font-size:10.5px; color:var(--text); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .usage-model { padding:3px 0 2px 14px; }
  .usage-model-main { padding:0; }
  .usage-model-main .ulbl { color:var(--faint); }
  .usage-model-main::before { content:'·'; color:var(--dim); }
  .usage-stats { display:flex; flex-wrap:wrap; gap:2px 10px; margin:1px 0 4px 31px; font-size:9.5px; line-height:1.35; color:var(--dim); }
  .usage-model .usage-stats { margin:1px 0 0 14px; }
  .usage-stat { white-space:nowrap; }
  .g { color:var(--ok); } .y { color:var(--warn); } .r { color:var(--bad); }
  .bar i.g { background:var(--ok); }
  .bar i.y { background:var(--warn); }
  .bar i.r { background:var(--bad); }
  .err { color:var(--bad); font-size:11px; }
  #cfg {
    display:none; flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
    overscroll-behavior:contain; scrollbar-gutter:stable;
    padding:9px 12px 16px; margin:0 8px 8px;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
  }
  #panel.settings-open #body { display:none; }
  #panel.settings-open #cfg { display:block; }
  #cfg .sec { font-size:11px; color:var(--dim); margin:6px 0 3px; }
  #pick, #themes, #meta, #winOpts { display:flex; flex-wrap:wrap; gap:5px; padding:3px 0 1px; }
  .chip { border:0; font-size:11px; padding:3px 10px; border-radius:99px; background:var(--track); color:var(--faint); cursor:pointer; transition:background .15s, color .15s, transform .1s; }
  button:focus-visible, .usage-filter select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .chip:hover { color:var(--text); }
  .chip.on { color:var(--text); background:var(--accent-soft); }
  .chip:active { transform:scale(.94); }
  #cfg input[type=range] { width:100%; accent-color:var(--accent); height:14px; }
  .albl { display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-bottom:1px; }
  .bgrow { display:flex; gap:8px; padding:3px 0 2px; }
  .bgbtn { flex:1; text-align:center; font-size:11.5px; color:var(--muted); background:var(--track); border-radius:7px; padding:5px 0; cursor:pointer; transition:background .15s, color .15s, transform .1s; }
  .bgbtn:hover { color:var(--text); }
  .bgbtn:active { transform:scale(.96); }
  body.motion, body.motion #panel, body.motion .card, body.motion .usage,
  body.motion #cfg, body.motion .pill, body.motion .usage-filter select,
  body.motion .usage-periods button {
    transition:background-color .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  body.motion #bg { transition:filter .18s var(--ease), transform .18s var(--ease); }
  body.motion #scrim { transition:background-color .18s var(--ease), backdrop-filter .18s var(--ease); }
  body.motion #body, body.motion #cfg { scroll-behavior:smooth; }
  body:not(.motion) *, body:not(.motion) *::before, body:not(.motion) *::after {
    transition:none !important; animation:none !important; scroll-behavior:auto !important;
  }
</style>
</head>
<body>
<div id="bg"></div>
<div id="scrim"></div>
<div id="panel">
  <div class="hdr" id="hdr">
    <span class="dot" id="stateDot"></span><b>Quota</b><span class="status" id="status" title="">准备中</span><span class="sp"></span>
    <span class="ico" id="tWeb" title="打开 Web 配置页">🌐</span>
    <span class="ico pin" id="tPin" title="置顶"><i>📌</i></span>
    <span class="ico" id="tCfg" title="设置" role="button" tabindex="0" aria-controls="cfg" aria-expanded="false">⚙</span>
    <span class="ico" id="tRef" title="刷新">↻</span>
    <span class="ico" id="tQuit" title="退出">✕</span>
  </div>
  <div id="body"><div id="list"><div class="txt" style="padding:6px 0">加载中…</div></div></div>
  <div id="cfg">
    <div class="sec">窗口</div>
    <div class="albl"><span>不透明度</span><span id="aVal">82%</span></div>
    <input type="range" id="alphaR" min="20" max="100">
    <div id="winOpts"><span class="chip" id="roundedChip">圆角窗口</span><button type="button" class="chip" id="animationChip" aria-pressed="false">动画效果</button></div>
    <div class="sec">背景图片</div>
    <div class="bgrow">
      <span class="bgbtn" id="bgPick">选择图片…</span>
      <span class="bgbtn" id="bgClear" style="display:none">恢复默认</span>
    </div>
    <div id="bgDimWrap" style="display:none">
    <div class="albl"><span>背景压暗</span><span id="bgDimVal">55%</span></div>
    <input type="range" id="bgDimR" min="0" max="90">
    <div class="albl"><span>背景模糊</span><span id="bgBlurVal">8px</span></div>
    <input type="range" id="bgBlurR" min="0" max="30">
    <div class="albl"><span>毛玻璃模糊</span><span id="glassBlurVal">16px</span></div>
    <input type="range" id="glassBlurR" min="0" max="30">
    </div>
    <div class="sec">配色主题</div>
    <div id="themes"></div>
    <div class="sec">显示内容</div>
    <div id="pick"></div>
    <div class="sec">卡片信息</div>
    <div id="meta"></div>
  </div>
  <div class="rs" id="rsHdl" title="拖动调整大小"></div>
</div>
<script>
let S = { alpha:82, show:{}, on_top:true, bg_dim:55, bg_blur:8, glass_blur:16, rounded:true, theme:'dark', animations:false, usage_period:'30d', usage_harnesses:{} };
const THEMES = [['dark','暗夜'],['ocean','湛蓝'],['forest','翠绿'],['violet','紫檀'],['paper','浅白']];
let cache = [];
let api = null;
let refreshing = false;
let renderedContent = '';
let renderedStructure = '';
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const color = p => p>=40?'g':p>=15?'y':'r';

function row(w, account=''){
  if(w.text!=null) return `<div class="row"><div class="top"><span class="lbl">${esc(w.name)}</span><span class="rst"></span><span class="txt">${esc(w.text)}</span></div></div>`;
  if(w.remaining_percent==null) return `<div class="row"><div class="top"><span class="lbl">${esc(w.name)}</span><span class="rst"></span><span class="txt">暂无数据</span></div></div>`;
  const p = Math.round(w.remaining_percent), c = color(p);
  const rst = w.reset ? esc(w.reset) : '';
  return `<div class="row"><div class="top"><span class="lbl">${esc(w.name)}</span><span class="rst">${rst}</span><span class="pct ${c}">${p}%</span></div><div class="bar"><i data-bar="${esc(account+'|'+w.name)}" class="${c}" style="width:${p}%"></i></div></div>`;
}

function usageOn(){ return S.show['#usage']===true; }
function fmtUsage(v){
  const n = Number(v);
  if(!Number.isFinite(n)) return '';
  if(Math.abs(n)>=1e9) return (n/1e9).toFixed(n>=1e10?1:2).replace(/\.?0+$/,'')+'B';
  if(Math.abs(n)>=1e6) return (n/1e6).toFixed(n>=1e7?1:2).replace(/\.?0+$/,'')+'M';
  if(Math.abs(n)>=1e3) return (n/1e3).toFixed(n>=1e4?1:2).replace(/\.?0+$/,'')+'K';
  return Number.isInteger(n) ? n.toLocaleString() : n.toLocaleString([], {maximumFractionDigits:2});
}
function usageValue(u){
  if(u.total_tokens!=null) return `${fmtUsage(u.total_tokens)} Token`;
  if(u.used!=null && u.total!=null) return `${fmtUsage(u.used)} / ${fmtUsage(u.total)}${u.unit?' '+esc(u.unit):''}`;
  return '';
}
function usageStats(values){
  if(!values || typeof values!=='object') return '';
  const stats = [
    ['输入',values.input,true],
    ['缓存读',values.cached,Number(values.cached)>0],
    ['缓存写',values.cache_write,Number(values.cache_write)>0],
    ['输出',values.output,true],
    ['推理',values.reasoning,Number(values.reasoning)>0],
  ].filter(([,value,show])=>show && value!=null && Number.isFinite(Number(value)));
  if(!stats.length) return '';
  return `<div class="usage-stats">${stats.map(([label,value])=>`<span class="usage-stat" title="${Number(value).toLocaleString()}">${label} ${fmtUsage(value)}</span>`).join('')}</div>`;
}
function usageAggregate(rows){
  const breakdown={};
  for(const key of ['input','cached','cache_write','output','reasoning']) breakdown[key]=rows.reduce((sum,row)=>sum+Number((row.breakdown||{})[key]||0),0);
  const period=S.usage_period==='all'?'累计':`近 ${String(S.usage_period).replace('d','')} 天`;
  return {source:'local',label:`本机合计 · ${period}`,total_tokens:rows.reduce((sum,row)=>sum+Number(row.total_tokens||0),0),breakdown};
}
function accountKey(item){ return `${item.provider||item.title}:${item.identity||item.email||item.title}`; }
function usageHarnesses(item){
  if(Array.isArray(item.harnesses)) return item.harnesses.map(h=>[h.key,h.label]);
  return [...new Map((item.usage||[]).filter(row=>row.source==='local'&&row.harness).map(row=>[row.harness,row.harness_label||row.harness])).entries()];
}
function setUsagePeriod(value){ S.usage_period=value; save(); render(cache); }
function setUsageHarness(account, value){ S.usage_harnesses[account]=value; save(); render(cache); }
function usageBlock(item){
  const rows=Array.isArray(item.usage)?item.usage:[], harnesses=usageHarnesses(item);
  if(!usageOn() || (!rows.length && !harnesses.length)) return '';
  const key=accountKey(item), period=S.usage_period||'30d';
  const hasRemote=rows.some(row=>row.source==='remote');
  let harness=S.usage_harnesses[key]||'all';
  if(harness!=='all' && !(harness==='remote' && hasRemote) && !harnesses.some(([id])=>id===harness)) harness='all';
  const periodRows=rows.filter(row=>(row.period||'30d')===period);
  const local=periodRows.filter(row=>row.source==='local');
  const remote=periodRows.filter(row=>row.source==='remote');
  const visible=harness==='all'?[...(local.length===1?local:local.length?[usageAggregate(local)]:[]),...remote]
    :harness==='remote'?remote:local.filter(row=>row.harness===harness);
  const periods=[['1d','1天'],['7d','7天'],['30d','30天'],['all','累计']];
  let html = `<div class="usage"><div class="usage-title">用量信息</div><div class="usage-filter"><div class="usage-periods">${periods.map(([key,label])=>`<button class="${key===period?'on':''}" onclick="setUsagePeriod('${key}')">${label}</button>`).join('')}</div><select data-account="${esc(key)}" onchange="setUsageHarness(this.dataset.account,this.value)"><option value="all" ${harness==='all'?'selected':''}>全部客户端</option>${hasRemote?`<option value="remote" ${harness==='remote'?'selected':''}>远端</option>`:''}${harnesses.map(([id,label])=>`<option value="${esc(id)}" ${harness===id?'selected':''}>${esc(label)}</option>`).join('')}</select></div>`;
  if(!visible.length) return html+'<div class="txt">暂无用量</div></div>';
  for(const u of visible){
    const src = u.source==='local'?'本机':'远端';
    html += `<div class="usage-line"><span class="src">${src}</span><span class="ulbl">${esc(u.label||'用量')}</span><span class="uval">${usageValue(u)}</span></div>`;
    html += usageStats(u.breakdown);
    for(const m of (Array.isArray(u.models)?u.models:[])){
      const value = m.total_tokens==null ? '' : `${fmtUsage(m.total_tokens)} Token`;
      html += `<div class="usage-model"><div class="usage-model-main"><span class="ulbl">${esc(m.name||'未标记模型')}</span><span class="uval">${value}</span></div>${usageStats(m)}</div>`;
    }
  }
  return html+'</div>';
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function subscriptionText(it){
  const end = fmtDate(it.sub_end);
  return end ? `${it.sub_status === 'expired' ? '已到期' : '到期'} ${end}` : '';
}

function render(items){
  let html = '';
  for(const it of items){
    if(S.show[it.title]===false) continue;
    const meta = [];
    if(S.show['#email']!==false && it.email) meta.push(`<span>${esc(it.email)}</span>`);
    const pill = (S.show['#plan']!==false && it.plan) ? `<span class="pill">${esc(it.plan)}</span>` : '';
    html += `<div class="card"><div class="name"><b>${esc(it.title)}</b>${pill}${meta.join('')}</div>`;
    const sub = S.show['#plan']!==false ? subscriptionText(it) : '';
    if(sub) html += `<div class="sub">${esc(sub)}</div>`;
    html += it.ok ? it.windows.map(w=>row(w,accountKey(it))).join('') : `<div class="err">${esc(it.error||'失败')}</div>`;
    html += usageBlock(it);
    html += `</div>`;
  }
  const list=$('list'), content=html || '<div class="txt" style="padding:6px 0">没有账号</div>';
  if(renderedContent===content) return;
  const structure=items.filter(it=>S.show[it.title]!==false).map(accountKey).join('|');
  const widths=new Map(S.animations?[...list.querySelectorAll('[data-bar]')].map(bar=>[bar.dataset.bar,bar.style.width]):[]);
  list.innerHTML=content;
  renderedContent=content;
  // 入场淡入只在卡片结构变化时播放；自动刷新只更新数值，避免整列表每分钟闪一次
  if(structure!==renderedStructure){ renderedStructure=structure; animateView(list); }
  if(S.animations) list.querySelectorAll('[data-bar]').forEach(bar=>{
    const previous=widths.get(bar.dataset.bar)||'0%';
    if(previous!==bar.style.width && bar.animate) bar.animate([{width:previous},{width:bar.style.width}], {duration:420,easing:'cubic-bezier(.2,.7,.2,1)'});
  });
}

function animateView(element){
  if(!S.animations || !element?.animate) return;
  element.getAnimations?.().forEach(animation=>animation.cancel());
  element.animate([{opacity:.4},{opacity:1}], {duration:180,easing:'cubic-bezier(.2,.7,.2,1)'});
}
function applyMotion(){
  document.body.classList.toggle('motion', S.animations===true);
  $('animationChip').classList.toggle('on', S.animations===true);
  $('animationChip').setAttribute('aria-pressed', String(S.animations===true));
  if(!S.animations) document.getAnimations?.().forEach(animation=>animation.cancel());
}
function toggleAnimations(){
  S.animations=!S.animations;
  applyMotion(); animateView($('cfg')); save();
}
function toggleSettings(){
  const open=$('panel').classList.toggle('settings-open');
  $('tCfg').classList.toggle('on',open);
  $('tCfg').setAttribute('aria-expanded',String(open));
  animateView($(open?'cfg':'body'));
}

function buildThemes(){
  $('themes').innerHTML = THEMES.map(([k,label])=>`<span class="chip" data-t="${k}">${label}</span>`).join('');
  $('themes').querySelectorAll('.chip').forEach(el=>{
    el.onclick = ()=>{ S.theme = el.dataset.t; applyTheme(); save(); };
  });
}
function applyTheme(){
  document.body.dataset.theme = S.theme || 'dark';
  document.querySelectorAll('#themes .chip').forEach(el=>el.classList.toggle('on', el.dataset.t === (S.theme||'dark')));
}

function wireChips(container){
  container.querySelectorAll('.chip').forEach(el=>{
    const enabled = el.dataset.n==='#usage' ? usageOn() : S.show[el.dataset.n]!==false;
    el.classList.toggle('on', enabled);
    el.onclick = ()=>{
      const key = el.dataset.n;
      const next = key==='#usage' ? !usageOn() : S.show[key]===false;
      S.show[key] = next;
      el.classList.toggle('on', next);
      save();
      if(key==='#usage' && next) refresh(false); else render(cache);
    };
  });
}
function buildPick(){
  const names = [...new Set(cache.map(i=>i.title))];
  $('pick').innerHTML = names.map(n=>`<span class="chip" data-n="${esc(n)}">${esc(n)}</span>`).join('');
  $('meta').innerHTML = [['#email','邮箱'],['#plan','套餐'],['#usage','用量信息']].map(([k,label])=>`<span class="chip" data-n="${k}">${label}</span>`).join('');
  wireChips($('pick')); wireChips($('meta'));
}

function setRefreshState(text, state='ok', detail=''){
  const status = $('status'), dot = $('stateDot');
  status.textContent = text;
  status.title = detail || text;
  dot.classList.toggle('loading', state === 'loading');
  dot.classList.toggle('error', state === 'error');
}
function flashUpdated(){
  if(!S.animations) return;
  const panel = $('panel');
  panel.classList.remove('refreshed');
  void panel.offsetWidth;
  panel.classList.add('refreshed');
}
function resultLabel(meta){
  const stamp = new Date(meta.fetched_at || Date.now()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  if(meta.state === 'stale' || meta.stale) return [`旧数据 · ${stamp}`, 'error', '刷新失败，保留上次数据'];
  if(meta.state === 'error') return ['刷新失败', 'error', meta.error || '刷新失败，请稍后重试'];
  return [`已更新 · ${stamp}`, 'ok', `更新于 ${stamp}`];
}
async function refresh(force=false){
  if(refreshing) return;
  refreshing = true;
  $('tRef').classList.add('loading');
  setRefreshState('刷新中…', 'loading');
  try{
    const payload = await api.quota(!!force, usageOn());
    const meta = Array.isArray(payload) ? {} : (payload.snapshot || {});
    const next = Array.isArray(payload) ? payload : (payload.results || []);
    if(meta.state !== 'error' || !cache.length) cache = next;
    render(cache); buildPick();
    const [text, state, detail] = resultLabel(meta);
    setRefreshState(text, state, detail);
    if(state === 'ok' && force) flashUpdated();
  }catch(e){
    setRefreshState('刷新失败', 'error', e && e.message ? e.message : '刷新失败，请稍后重试');
    if(!cache.length){ renderedContent=''; $('list').innerHTML = '<div class="err" style="padding:6px 0">刷新失败，请稍后重试</div>'; }
  }finally{
    refreshing = false;
    $('tRef').classList.remove('loading');
  }
}
function save(){ try{ api.save_settings(JSON.stringify(S)); }catch(e){} }
function applyAlpha(){
  $('aVal').textContent = S.alpha + '%';
  $('alphaR').value = S.alpha;
  try{ api.set_alpha(S.alpha); }catch(e){}
}
function applyScrim(){
  $('scrim').style.background = `rgba(16,19,26,${(S.bg_dim||0)/100})`;
  const blur = `blur(${S.glass_blur ?? 16}px)`;
  $('scrim').style.backdropFilter = blur;
  $('scrim').style.webkitBackdropFilter = blur;
}
function applyBgBlur(){
  const b = S.bg_blur || 0;
  $('bg').style.filter = b ? `blur(${b}px)` : '';
  $('bg').style.transform = b ? `scale(${1 + 2*b/250})` : '';
}
function applyBackground(dataUrl){
  const has = !!dataUrl;
  document.body.classList.toggle('bg', has);
  $('bgClear').style.display = has ? '' : 'none';
  $('bgDimWrap').style.display = has ? '' : 'none';
  if(has){ $('bg').style.backgroundImage = `url("${dataUrl}")`; applyScrim(); applyBgBlur(); animateView($('bg')); }
}
function paintPin(){ $('tPin').classList.toggle('on', !!S.on_top); }

let inited = false;
async function init(){
  if(inited) return;
  inited = true;
  api = window.pywebview.api;

  try{ S = Object.assign(S, await api.settings()); }catch(e){}
  if(!['1d','7d','30d','all'].includes(S.usage_period)) S.usage_period='30d';
  if(!S.usage_harnesses || typeof S.usage_harnesses!=='object' || Array.isArray(S.usage_harnesses)) S.usage_harnesses={};
  delete S.usage_harness;
  S.animations=S.animations===true;
  applyMotion(); applyAlpha(); paintPin(); buildThemes(); applyTheme();

  $('tRef').onclick = ()=>refresh(true);
  $('tQuit').onclick = ()=>api.quit();
  $('tWeb').onclick = ()=>{ try{ api.open_web(); }catch(e){} };
  $('tCfg').onclick = toggleSettings;
  $('tCfg').onkeydown = e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggleSettings(); } };
  $('animationChip').onclick = toggleAnimations;
  $('tPin').onclick = async ()=>{
    try{
      const r = await api.toggle_on_top();
      S.on_top = !!r.on_top; paintPin();
    }catch(e){}
  };
  $('alphaR').oninput = e=>{ S.alpha = +e.target.value; applyAlpha(); };
  $('alphaR').onchange = ()=>save();

  $('bgDimVal').textContent = S.bg_dim + '%';
  $('bgDimR').value = S.bg_dim;
  $('bgDimR').oninput = e=>{ S.bg_dim = +e.target.value; $('bgDimVal').textContent = S.bg_dim + '%'; applyScrim(); };
  $('bgDimR').onchange = ()=>save();
  $('bgBlurVal').textContent = S.bg_blur + 'px';
  $('bgBlurR').value = S.bg_blur;
  $('bgBlurR').oninput = e=>{ S.bg_blur = +e.target.value; $('bgBlurVal').textContent = S.bg_blur + 'px'; applyBgBlur(); };
  $('bgBlurR').onchange = ()=>save();
  $('glassBlurVal').textContent = S.glass_blur + 'px';
  $('glassBlurR').value = S.glass_blur;
  $('glassBlurR').oninput = e=>{ S.glass_blur = +e.target.value; $('glassBlurVal').textContent = S.glass_blur + 'px'; applyScrim(); };
  $('glassBlurR').onchange = ()=>save();
  const roundedChip = $('roundedChip');
  const isMac = S.platform === 'darwin';
  const applyMacRadius = ()=>{ if(isMac) $('panel').style.borderRadius = (S.rounded===false) ? '0' : '14px'; };
  if(isMac) document.documentElement.classList.add('mac');
  const paintRounded = ()=>{ roundedChip.classList.toggle('on', S.rounded!==false); applyMacRadius(); };
  roundedChip.onclick = async ()=>{
    S.rounded = S.rounded===false;
    paintRounded(); save();
    if(isMac) return;
    try{ await api.set_rounded(S.rounded); }catch(e){}
  };
  paintRounded();
  $('bgPick').onclick = async ()=>{
    try{
      const r = await api.pick_background();
      if(r && r.ok) applyBackground(r.data_url);
      else if(r && r.error) setRefreshState(r.error, 'error', r.error);
    }catch(e){}
  };
  $('bgClear').onclick = async ()=>{
    try{
      await api.clear_background();
      const b = await api.background();
      applyBackground(b && b.data_url);
    }catch(e){ applyBackground(null); }
  };
  try{ const b = await api.background(); if(b && b.data_url) applyBackground(b.data_url); }catch(e){}

  // 按下标题栏 → 系统原生接管拖动（可跨屏）；必须把按下时的坐标传过去，
  // 桥有延迟，Python 侧再用当前光标会算错抓取点
  const hdr = $('hdr');
  hdr.addEventListener('pointerdown', e=>{
    if(e.target.closest('.ico')) return;
    if(e.button !== 0) return;
    e.preventDefault();
    try{ api.begin_drag(e.screenX, e.screenY); }catch(err){}
  });

  // 右下角手柄 → 系统原生接管缩放（WM_NCLBUTTONDOWN + HTBOTTOMRIGHT）
  $('rsHdl').addEventListener('pointerdown', e=>{
    if(e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    try{ api.begin_resize(e.screenX, e.screenY); }catch(err){}
  });

  await refresh();
  setInterval(()=>refresh(false), 60000);
}

if(window.pywebview && window.pywebview.api) init();
else document.addEventListener('pywebviewready', init);
setTimeout(init, 1500);
</script>
</body>
</html>
