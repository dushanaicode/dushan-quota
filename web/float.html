<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",system-ui,sans-serif; }
  html,body { background:#10131a; overflow:hidden; height:100%; }
  body { color:#e6ecf5; font-size:12px; user-select:none; -webkit-user-select:none; }
  #panel {
    background:#10131a;
    height:100vh;
    display:flex; flex-direction:column;
    overflow:hidden;
    position:relative; z-index:1;
  }
  #bg, #scrim { position:fixed; inset:0; z-index:0; pointer-events:none; display:none; }
  #bg { background-size:cover; background-position:center; }
  body.bg #bg { display:block; }
  body.bg #scrim { display:block; }
  body.bg #panel { background:transparent; }
  .rs {
    position:absolute; right:0; bottom:0; width:18px; height:18px;
    cursor:nwse-resize; z-index:5;
    background:
      linear-gradient(135deg, transparent 0 46%, rgba(255,255,255,.28) 46% 54%, transparent 54% 66%, rgba(255,255,255,.28) 66% 74%, transparent 74% 86%, rgba(255,255,255,.28) 86% 94%, transparent 94%);
  }
  .rs:hover { background:
      linear-gradient(135deg, transparent 0 46%, rgba(110,168,254,.75) 46% 54%, transparent 54% 66%, rgba(110,168,254,.75) 66% 74%, transparent 74% 86%, rgba(110,168,254,.75) 86% 94%, transparent 94%);
  }
  .hdr {
    display:flex; align-items:center; gap:7px;
    padding:9px 12px 8px;
    border-bottom:1px solid rgba(255,255,255,.06);
    cursor:move; flex:none;
  }
  .hdr .dot { width:7px; height:7px; border-radius:50%; background:#3dd68c; flex:none; box-shadow:0 0 6px rgba(61,214,140,.8); }
  .hdr .dot.loading { background:#f5c664; box-shadow:0 0 7px rgba(245,198,100,.85); animation:pulse .8s ease-in-out infinite alternate; }
  .hdr .dot.error { background:#f87171; box-shadow:0 0 7px rgba(248,113,113,.8); }
  .hdr b { font-size:12.5px; font-weight:600; letter-spacing:.5px; }
  .status { min-width:0; max-width:92px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#77839a; font-size:9px; }
  .hdr .sp { flex:1; }
  .ico { display:inline-flex; align-items:center; justify-content:center; cursor:pointer; opacity:.45; font-size:11px; line-height:1; padding:2px 3px; border-radius:5px; transition:opacity .15s, transform .1s; }
  .ico:active { transform:scale(.85); }
  .ico:hover { opacity:1; background:rgba(255,255,255,.10); }
  .ico.on { opacity:1; }
  .ico.loading { opacity:1; pointer-events:none; animation:spin .7s linear infinite; }
  #panel.refreshed { animation:flash .55s ease-out; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse { to { opacity:.45; transform:scale(.82); } }
  @keyframes flash { 0% { box-shadow:inset 0 0 0 1px rgba(61,214,140,.7); } 100% { box-shadow:inset 0 0 0 1px transparent; } }
  #body { overflow-y:auto; padding:2px 12px 6px; flex:1; }
  #body::-webkit-scrollbar { width:3px; }
  #body::-webkit-scrollbar-thumb { background:rgba(255,255,255,.16); border-radius:99px; }
  .card { padding:8px 0 7px; border-top:1px solid rgba(255,255,255,.06); }
  .card:first-child { border-top:0; }
  .name { display:flex; align-items:center; gap:7px; margin-bottom:5px; }
  .name b { font-size:12px; font-weight:600; color:#f0f5fb; white-space:nowrap; }
  .pill { font-size:9px; padding:1px 6px; border-radius:99px; background:rgba(110,168,254,.15); color:#9ec2ff; white-space:nowrap; flex:none; }
  .name span { font-size:10px; color:#77839a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sub { color:#657188; font-size:9px; margin:-2px 0 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row { margin:5px 0 1px; }
  .row .top { display:flex; align-items:baseline; gap:7px; margin-bottom:3px; }
  .row .lbl { font-size:10.5px; color:#93a0b6; white-space:nowrap; }
  .row .rst { flex:1; text-align:right; font-size:9px; color:#5f6b81; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .pct { font-size:10.5px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .bar { height:5px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:99px; }
  .txt { font-size:10px; color:#aeb9cc; }
  .g { color:#4ade88; } .y { color:#f5c664; } .r { color:#f87171; }
  .bar i.g { background:linear-gradient(90deg,#34d399,#4ade88); }
  .bar i.y { background:linear-gradient(90deg,#eab308,#f5c664); }
  .bar i.r { background:linear-gradient(90deg,#ef4444,#f87171); }
  .err { color:#f87171; font-size:10px; }
  #cfg {
    display:none; flex:none; padding:8px 12px 7px; margin:0 8px 7px;
    background:rgba(255,255,255,.05); border-radius:10px;
  }
  #cfg .sec { font-size:10px; color:#7d89a0; margin:4px 0 2px; }
  #pick { display:flex; flex-wrap:wrap; gap:5px; padding:3px 0 1px; }
  .chip { font-size:10px; padding:2.5px 9px; border-radius:99px; background:rgba(255,255,255,.06); color:#77839a; cursor:pointer; transition:background .15s, color .15s, transform .1s; }
  .chip:hover { color:#c8d2e2; background:rgba(255,255,255,.12); }
  .chip.on { color:#e6ecf5; background:rgba(255,255,255,.18); }
  .chip:active { transform:scale(.94); }
  #cfg input[type=range] { width:100%; accent-color:#6ea8fe; height:14px; }
  .albl { display:flex; justify-content:space-between; font-size:10.5px; color:#a7b2c6; margin-bottom:1px; }
  .bgrow { display:flex; gap:8px; padding:3px 0 2px; }
  .bgbtn { flex:1; text-align:center; font-size:10.5px; color:#a7b2c6; background:rgba(255,255,255,.07); border-radius:7px; padding:4px 0; cursor:pointer; transition:background .15s, color .15s, transform .1s; }
  .bgbtn:hover { color:#e2e9f4; background:rgba(255,255,255,.14); }
  .bgbtn:active { transform:scale(.96); }
</style>
</head>
<body>
<div id="bg"></div>
<div id="scrim"></div>
<div id="panel">
  <div class="hdr" id="hdr">
    <span class="dot" id="stateDot"></span><b>Quota</b><span class="status" id="status" title="">准备中</span><span class="sp"></span>
    <span class="ico" id="tPin" title="置顶">📌</span>
    <span class="ico" id="tCfg" title="设置">⚙</span>
    <span class="ico" id="tRef" title="刷新">↻</span>
    <span class="ico" id="tQuit" title="退出">✕</span>
  </div>
  <div id="body"><div id="list"><div class="txt" style="padding:6px 0">加载中…</div></div></div>
  <div id="cfg">
    <div class="sec">窗口</div>
    <div class="albl"><span>不透明度</span><span id="aVal">82%</span></div>
    <input type="range" id="alphaR" min="20" max="100">
    <div class="sec">背景图片</div>
    <div class="bgrow">
      <span class="bgbtn" id="bgPick">选择图片…</span>
      <span class="bgbtn" id="bgClear" style="display:none">清除背景</span>
    </div>
    <div id="bgDimWrap" style="display:none">
    <div class="albl"><span>背景压暗</span><span id="bgDimVal">55%</span></div>
    <input type="range" id="bgDimR" min="0" max="90">
    </div>
    <div class="sec">显示内容</div>
    <div id="pick"></div>
  </div>
  <div class="rs" id="rsHdl" title="拖动调整大小"></div>
</div>
<script>
let S = { alpha:82, show:{}, on_top:true, bg_dim:55 };
let cache = [];
let api = null;
let refreshing = false;
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const color = p => p>=40?'g':p>=15?'y':'r';

function row(w){
  if(w.text!=null) return `<div class="row"><div class="top"><span class="lbl">${esc(w.name)}</span><span class="rst"></span><span class="txt">${esc(w.text)}</span></div></div>`;
  if(w.remaining_percent==null) return `<div class="row"><div class="top"><span class="lbl">${esc(w.name)}</span><span class="rst"></span><span class="txt">未知/暂不可获取</span></div></div>`;
  const p = Math.round(w.remaining_percent), c = color(p);
  const rst = w.reset ? esc(w.reset) : '';
  return `<div class="row"><div class="top"><span class="lbl">${esc(w.name)}</span><span class="rst">${rst}</span><span class="pct ${c}">${p}%</span></div><div class="bar"><i class="${c}" style="width:${p}%"></i></div></div>`;
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function subscriptionText(it){
  const start = fmtDate(it.sub_start), end = fmtDate(it.sub_end);
  if(start && end) return `订阅生效 ${start} · ${it.sub_status === 'expired' ? '已到期' : '到期'} ${end}`;
  if(end) return `${it.sub_status === 'expired' ? '历史订阅已到期' : '订阅到期'} ${end}`;
  if(start) return `订阅生效 ${start}`;
  if(it.sub_status === 'not_applicable') return '订阅 免费方案 · 到期 不适用';
  if(it.sub_status === 'unavailable') return '订阅信息暂未取得，请刷新重试';
  return '';
}

function render(items){
  let html = '';
  for(const it of items){
    if(S.show[it.title]===false) continue;
    const meta = [];
    if(S.show['#email']!==false && it.email) meta.push(`<span>${esc(it.email)}</span>`);
    const pill = (S.show['#plan']!==false && it.plan) ? `<span class="pill">${esc(it.plan)}</span>` : '';
    html += `<div class="card"><div class="name"><b>${esc(it.title)}</b>${pill}${meta.join('')}</div>`;
    const sub = subscriptionText(it);
    if(sub) html += `<div class="sub">${esc(sub)}</div>`;
    html += it.ok ? it.windows.map(row).join('') : `<div class="err">${esc(it.error||'失败')}</div>`;
    html += `</div>`;
  }
  $('list').innerHTML = html || '<div class="txt" style="padding:6px 0">没有账号</div>';
}

function buildPick(){
  const names = [...new Set(cache.map(i=>i.title))];
  const chips = names.map(n=>[n,n]).concat([['#email','邮箱'],['#plan','套餐']]);
  $('pick').innerHTML = chips.map(([k,label])=>`<span class="chip" data-n="${esc(k)}">${esc(label)}</span>`).join('');
  $('pick').querySelectorAll('.chip').forEach(el=>{
    el.classList.toggle('on', S.show[el.dataset.n]!==false);
    el.onclick = ()=>{
      S.show[el.dataset.n] = S.show[el.dataset.n]===false;
      el.classList.toggle('on', S.show[el.dataset.n]!==false);
      save(); render(cache);
    };
  });
}

function setRefreshState(text, state='ok', detail=''){
  const status = $('status'), dot = $('stateDot');
  status.textContent = text;
  status.title = detail || text;
  dot.classList.toggle('loading', state === 'loading');
  dot.classList.toggle('error', state === 'error');
}
function flashUpdated(){
  const panel = $('panel');
  panel.classList.remove('refreshed');
  void panel.offsetWidth;
  panel.classList.add('refreshed');
}
function resultLabel(meta, forced){
  const stamp = new Date(meta.fetched_at || Date.now()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  if(meta.state === 'stale' || meta.stale) return [`旧数据 · ${stamp}`, 'error', '刷新失败，正在显示上一次成功快照'];
  if(meta.state === 'error') return ['刷新失败', 'error', meta.error || '刷新失败，请稍后重试'];
  if(meta.from_cache && !forced) return [`缓存 · ${Math.round(meta.age_seconds || 0)}s`, 'ok', `快照时间 ${stamp}`];
  return [`已更新 · ${stamp}`, 'ok', meta.from_cache ? '已读取其他客户端完成的共享刷新' : '已完成 Provider 刷新'];
}
async function refresh(force=false){
  if(refreshing) return;
  refreshing = true;
  $('tRef').classList.add('loading');
  setRefreshState('刷新中…', 'loading', force ? '正在强制刷新共享快照' : '正在读取共享快照');
  try{
    const payload = await api.quota(!!force);
    const meta = Array.isArray(payload) ? {} : (payload.snapshot || {});
    const next = Array.isArray(payload) ? payload : (payload.results || []);
    if(next.length || !cache.length) cache = next;
    render(cache); buildPick();
    const [text, state, detail] = resultLabel(meta, !!force);
    setRefreshState(text, state, detail);
    if(state === 'ok' && force) flashUpdated();
  }catch(e){
    setRefreshState('刷新失败', 'error', e && e.message ? e.message : '刷新失败，请稍后重试');
    if(!cache.length) $('list').innerHTML = '<div class="err" style="padding:6px 0">刷新失败，请稍后重试</div>';
  }finally{
    refreshing = false;
    $('tRef').classList.remove('loading');
  }
}
function save(){ try{ api.save_settings(JSON.stringify(S)); }catch(e){} }
function applyAlpha(){
  $('aVal').textContent = S.alpha + '%';
  $('alphaR').value = S.alpha;
  try{ api.set_alpha(S.alpha); }catch(e){}
}
function applyScrim(){ $('scrim').style.background = `rgba(16,19,26,${(S.bg_dim||0)/100})`; }
function applyBackground(dataUrl){
  const has = !!dataUrl;
  document.body.classList.toggle('bg', has);
  $('bgClear').style.display = has ? '' : 'none';
  $('bgDimWrap').style.display = has ? '' : 'none';
  if(has){ $('bg').style.backgroundImage = `url("${dataUrl}")`; applyScrim(); }
}
function paintPin(){ $('tPin').classList.toggle('on', !!S.on_top); }

let inited = false;
async function init(){
  if(inited) return;
  inited = true;
  api = window.pywebview.api;

  try{ S = Object.assign(S, await api.settings()); }catch(e){}
  applyAlpha(); paintPin();

  $('tRef').onclick = ()=>refresh(true);
  $('tQuit').onclick = ()=>api.quit();
  $('tCfg').onclick = ()=>{ const c=$('cfg'); c.style.display = c.style.display==='block'?'none':'block'; };
  $('tPin').onclick = async ()=>{
    try{
      const r = await api.toggle_on_top();
      S.on_top = !!r.on_top; paintPin();
    }catch(e){}
  };
  $('alphaR').oninput = e=>{ S.alpha = +e.target.value; applyAlpha(); };
  $('alphaR').onchange = ()=>save();

  $('bgDimVal').textContent = S.bg_dim + '%';
  $('bgDimR').value = S.bg_dim;
  $('bgDimR').oninput = e=>{ S.bg_dim = +e.target.value; $('bgDimVal').textContent = S.bg_dim + '%'; applyScrim(); };
  $('bgDimR').onchange = ()=>save();
  $('bgPick').onclick = async ()=>{
    try{
      const r = await api.pick_background();
      if(r && r.ok) applyBackground(r.data_url);
      else if(r && r.error) setRefreshState(r.error, 'error', r.error);
    }catch(e){}
  };
  $('bgClear').onclick = async ()=>{
    try{ await api.clear_background(); }catch(e){}
    applyBackground(null);
  };
  try{ const b = await api.background(); if(b && b.data_url) applyBackground(b.data_url); }catch(e){}

  // 按下标题栏 → 系统原生接管拖动（可跨屏）；必须把按下时的坐标传过去，
  // 桥有延迟，Python 侧再用当前光标会算错抓取点
  const hdr = $('hdr');
  hdr.addEventListener('pointerdown', e=>{
    if(e.target.closest('.ico')) return;
    if(e.button !== 0) return;
    e.preventDefault();
    try{ api.begin_drag(e.screenX, e.screenY); }catch(err){}
  });

  // 右下角手柄 → 系统原生接管缩放（WM_NCLBUTTONDOWN + HTBOTTOMRIGHT）
  $('rsHdl').addEventListener('pointerdown', e=>{
    if(e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    try{ api.begin_resize(e.screenX, e.screenY); }catch(err){}
  });

  await refresh();
  setInterval(()=>refresh(false), 60000);
}

if(window.pywebview && window.pywebview.api) init();
else document.addEventListener('pywebviewready', init);
setTimeout(init, 1500);
</script>
</body>
</html>
